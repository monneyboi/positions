[project]
name = "positions"
version = "0.4.0"
description = "Personal human-reviewed queue for Wikidata edits to political positions"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "textual>=8.2.8",
]

[project.scripts]
positions = "positions.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/positions"]

[tool.ruff]
src = ["src"]
