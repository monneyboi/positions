[project]
name = "positions"
version = "0.1.0"
description = "Personal low-level tool for auditing and improving political positions on Wikidata"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
positions = "positions.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/positions"]

[tool.ruff]
src = ["src"]
